<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="v-amber-1" x1="16" y1="24" x2="112" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="v-amber-2" x1="16" y1="64" x2="112" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="v-amber-3" x1="16" y1="104" x2="112" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="v-blue-anchor" x1="18" y1="20" x2="36" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Left Balance Sheet Anchor -->
  <rect x="18" y="24" width="12" height="80" rx="3.5" fill="url(#v-blue-anchor)"/>

  <!-- Three Laminar Transmission Channels (TGA, RRP, Reserves converging into directional impulse) -->
  <!-- Top Stream -->
  <path d="M34 32 C 58 32, 78 44, 102 60 L 102 70 C 78 54, 58 44, 34 44 Z" fill="url(#v-amber-1)"/>

  <!-- Center Accelerator Vector (Sharp Pulse) -->
  <path d="M34 58 L 84 58 C 94 58, 104 61, 114 64 C 104 67, 94 70, 84 70 L 34 70 Z" fill="url(#v-amber-2)"/>

  <!-- Bottom Stream -->
  <path d="M34 96 C 58 96, 78 84, 102 68 L 102 58 C 78 74, 58 84, 34 84 Z" fill="url(#v-amber-3)"/>

  <!-- Precision Convergence Vertex Dot -->
  <circle cx="114" cy="64" r="3.5" fill="#fef08a"/>
</svg>
