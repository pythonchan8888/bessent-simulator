<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background glow for dark themes -->
    <radialGradient id="mark-glow" cx="64" cy="64" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Amber Transmission Gradient (Primary flow) -->
    <linearGradient id="amber-flow-top" x1="16" y1="28" x2="112" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="amber-flow-bot" x1="16" y1="100" x2="112" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Deep Balance Sheet Structural Base (Left Anchor) -->
    <linearGradient id="anchor-grad" x1="16" y1="20" x2="38" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Emerald impulse accent line -->
    <linearGradient id="pulse-accent" x1="38" y1="64" x2="116" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="54" fill="url(#mark-glow)"/>

  <!-- Left Balance Sheet Anchor Column (Structured Pillar with 3 segment notches) -->
  <rect x="18" y="24" width="14" height="80" rx="4" fill="url(#anchor-grad)"/>
  
  <!-- Transmission Ribbons (Flowing from Left Reservoir -> Converging Delta Stream) -->
  <!-- Top Stream (TGA / High-Powered Cash release) -->
  <path d="M32 34 C 54 34, 76 48, 106 60 C 110 61.8, 110 66.2, 106 68 C 76 80, 54 94, 32 94 L 32 80 C 48 80, 66 70, 88 64 C 66 58, 48 48, 32 48 Z" 
        fill="url(#amber-flow-top)"/>

  <!-- Inner Stream (Accelerated core flow with high-signal amber glow) -->
  <path d="M32 50 C 46 50, 62 56, 82 64 C 62 72, 46 78, 32 78 L 32 68 C 42 68, 54 65.5, 66 64 C 54 62.5, 42 60, 32 60 Z" 
        fill="#ffffff" opacity="0.85"/>

  <!-- Precision Measurement Ticks / Flow Velocity Markers -->
  <circle cx="106" cy="64" r="4.5" fill="#fbbf24"/>
  <circle cx="106" cy="64" r="2" fill="#0a0a12"/>
</svg>
